# Una sola app: web (Astro) + API en el mismo contenedor y puerto.
#   cp .env.example .env    # completá AUTH_SECRET y WALLET_PEPPER
#   docker compose up --build
#   → http://localhost:3000  (API en /api, salud en /health)
name: fractachain

services:
  app:
    build:
      context: .
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-}
        PUBLIC_FIREBASE_API_KEY: ${PUBLIC_FIREBASE_API_KEY:-}
        PUBLIC_FIREBASE_AUTH_DOMAIN: ${PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        PUBLIC_FIREBASE_PROJECT_ID: ${PUBLIC_FIREBASE_PROJECT_ID:-}
        PUBLIC_FIREBASE_APP_ID: ${PUBLIC_FIREBASE_APP_ID:-}
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost:3000}
      HACKATHON_DEMO: ${HACKATHON_DEMO:-true}
    volumes:
      - app-data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 25s

volumes:
  app-data:
