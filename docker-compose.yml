# Local stand-in for the two Railway services:
#   cp apps/api/.env.example apps/api/.env   # fill AUTH_SECRET / WALLET_PEPPER
#   docker compose up --build
#
# The browser talks to the API at http://localhost:4000. PUBLIC_* variables
# are inlined into the web bundle at build time: rebuild `web` when the public
# API URL changes.
name: fractachain

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      PORT: "4000"
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
      STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      STELLAR_FRIENDBOT_URL: ${STELLAR_FRIENDBOT_URL:-https://friendbot.stellar.org}
      STELLAR_NETWORK_PASSPHRASE: ${STELLAR_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      HACKATHON_DEMO: ${HACKATHON_DEMO:-true}
    volumes:
      - api-data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
